<script>
(() => {
    const themeButtons = document.querySelectorAll('[data-theme-choice]');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const themeColors = { dark: '#070d1b', light: '#f4f8ff', glass: '#101b36' };

    const setTheme = theme => {
        if (!Object.hasOwn(themeColors, theme)) return;
        document.body.dataset.theme = theme;
        themeColor.content = themeColors[theme];
        themeButtons.forEach(button => {
            button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme));
        });
        localStorage.setItem('tsm-kit-theme', theme);
    };

    const savedTheme = localStorage.getItem('tsm-kit-theme');
    if (savedTheme && Object.hasOwn(themeColors, savedTheme)) setTheme(savedTheme);

    themeButtons.forEach(button => {
        button.addEventListener('click', () => setTheme(button.dataset.themeChoice));
    });
})();
</script>
